<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAO-Style Action RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="game-canvas-container"></div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>

    <div id="dodge-btn" class="touch-btn">Esq.</div>
    <div id="block-btn" class="touch-btn">Bloq.</div>
    <div id="attack-btn" class="touch-btn">Atacar</div>
    <div id="skill-buttons"></div>
    <div id="inventory-toggle-btn" class="touch-btn">🎒</div>
    <div id="crafting-toggle-btn" class="touch-btn">🔨</div>
    <div id="settings-toggle-btn" class="touch-btn">⚙️</div>
    <div id="progress-toggle-btn" class="touch-btn">📋</div>
    <div id="vendor-interact-btn" class="touch-btn hidden">Hablar</div>
  </div>

  <div id="hud">
    <div id="hud-zone-name"></div>
    <div id="hud-level">Nv. 1</div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">HP</div>
      <div class="hud-bar-bg"><div id="hp-bar-fill" class="hud-bar-fill hp-fill"></div></div>
    </div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">XP</div>
      <div class="hud-bar-bg"><div id="xp-bar-fill" class="hud-bar-fill xp-fill"></div></div>
    </div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">STA</div>
      <div class="hud-bar-bg"><div id="stamina-bar-fill" class="hud-bar-fill stamina-fill"></div></div>
    </div>
    <div id="fatigue-indicator" class="hidden">Fatiga</div>
    <div id="buffs-container"></div>
  </div>

  <div id="notification-container"></div>
  <div id="damage-number-container"></div>

  <div id="inventory-overlay" class="hidden">
    <div id="inventory-panel">
      <div id="inventory-header">
        <span id="inventory-title">Inventario</span>
        <span id="inventory-count">0/30</span>
        <span id="inventory-close-btn">✕</span>
      </div>

      <div id="equipped-section">
        <div class="equipped-slot" id="equipped-weapon-slot">
          <div class="equipped-slot-label">Arma</div>
          <div class="equipped-slot-content"></div>
        </div>
        <div class="equipped-slot" id="equipped-armor-slot">
          <div class="equipped-slot-label">Armadura</div>
          <div class="equipped-slot-content"></div>
        </div>
      </div>

      <div id="inventory-grid"></div>
    </div>
  </div>

  <div id="item-action-menu" class="hidden">
    <div id="item-action-menu-card">
      <div id="item-action-name"></div>
      <button id="item-action-equip">Equipar</button>
      <button id="item-action-use">Usar</button>
      <button id="item-action-drop">Tirar</button>
      <button id="item-action-cancel">Cancelar</button>
    </div>
  </div>

  <div id="crafting-overlay" class="hidden">
    <div id="crafting-panel">
      <div id="crafting-header">
        <span>Crafteo</span>
        <span id="crafting-close-btn">✕</span>
      </div>
      <div id="crafting-list"></div>
    </div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-header"><span>Ajustes</span><span id="settings-close-btn">✕</span></div>
      <div class="settings-row">
        <span>Sonido</span>
        <button id="settings-sound-toggle" class="settings-inline-btn"></button>
      </div>
      <div class="settings-row settings-row-column">
        <span>Sensibilidad del joystick</span>
        <input type="range" id="settings-sensitivity-slider" min="0.5" max="2" step="0.1" />
      </div>
      <button id="settings-save-btn">Guardar Partida</button>
    </div>
  </div>

  <div id="progress-overlay" class="hidden">
    <div id="progress-panel">
      <div id="progress-header">
        <span>Progreso</span>
        <span id="progress-close-btn">✕</span>
      </div>
      <div id="progress-tabs">
        <button class="progress-tab-btn active" data-tab="quests">Misiones</button>
        <button class="progress-tab-btn" data-tab="achievements">Logros</button>
        <button class="progress-tab-btn" data-tab="bestiary">Bestiario</button>
        <button class="progress-tab-btn" data-tab="stats">Stats</button>
      </div>
      <div id="progress-tab-quests" class="progress-tab-content"></div>
      <div id="progress-tab-achievements" class="progress-tab-content hidden"></div>
      <div id="progress-tab-bestiary" class="progress-tab-content hidden"></div>
      <div id="progress-tab-stats" class="progress-tab-content hidden"></div>
    </div>
  </div>

  <div id="shop-overlay" class="hidden">
    <div id="shop-panel">
      <div id="shop-header">
        <span>Tienda</span>
        <span id="shop-currency-display"></span>
        <span id="shop-close-btn">✕</span>
      </div>
      <div id="shop-columns">
        <div id="shop-buy-column">
          <div class="shop-column-title">Comprar</div>
          <div id="shop-buy-list"></div>
        </div>
        <div id="shop-sell-column">
          <div class="shop-column-title">Vender</div>
          <div id="shop-sell-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="hidden">
    <div id="confirm-panel">
      <p id="confirm-message"></p>
      <div id="confirm-buttons">
        <button id="confirm-yes-btn">Sí</button>
        <button id="confirm-no-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="victory-overlay" class="hidden">
    <div id="victory-panel">
      <h2>¡Guardián derrotado!</h2>
      <p>Completaste tu ascenso por los 8 pisos.</p>
      <button id="victory-dismiss-btn">Seguir jugando</button>
    </div>
  </div>

  <div id="menu-overlay">
    <div id="menu-main-screen">
      <h1 id="menu-title">SAO-Style Action RPG</h1>
      <button id="btn-new-game">Nueva Partida</button>
      <button id="btn-continue" class="hidden">Continuar</button>
      <button id="btn-menu-settings">Ajustes</button>
    </div>
    <div id="menu-difficulty-screen" class="hidden">
      <h2>Elegí la dificultad</h2>
      <button class="difficulty-btn" data-difficulty="easy">Fácil</button>
      <button class="difficulty-btn" data-difficulty="normal">Normal</button>
      <button class="difficulty-btn" data-difficulty="hard">Difícil</button>
      <button id="btn-difficulty-back">Volver</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/leveling.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/crafting.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/stats-tracker.js"></script>
  <script src="js/bestiary.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
