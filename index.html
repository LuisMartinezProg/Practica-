<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAO-Style Action RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="game-canvas-container"></div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>
    <!-- Botones de ataque/esquiva/bloqueo/skills se agregan en el Hito 3 -->
  </div>

  <div id="menu-overlay">
    <h1 id="menu-title">SAO-Style Action RPG</h1>
    <button id="btn-new-game">Nueva Partida</button>
    <!-- Botón "Continuar", Ajustes y dificultad se agregan en el Hito 7 -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
