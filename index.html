<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAO-Style Action RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="game-canvas-container"></div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>
    <!-- Botones de ataque/esquiva/bloqueo/skills se agregan en el Hito 3 -->
  </div>

  <div id="menu-overlay">
    <!-- HUD permanente (Hito 2) -->
  <div id="hud">
    <div id="hud-level">Nv. 1</div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">HP</div>
      <div class="hud-bar-bg"><div id="hp-bar-fill" class="hud-bar-fill hp-fill"></div></div>
    </div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">XP</div>
      <div class="hud-bar-bg"><div id="xp-bar-fill" class="hud-bar-fill xp-fill"></div></div>
    </div>
    <div class="hud-bar-row">
      <div class="hud-bar-label">STA</div>
      <div class="hud-bar-bg"><div id="stamina-bar-fill" class="hud-bar-fill stamina-fill"></div></div>
    </div>
  </div>

  <div id="notification-container"></div>

    <h1 id="menu-title">SAO-Style Action RPG</h1>
    <button id="btn-new-game">Nueva Partida</button>
    <!-- Botón "Continuar", Ajustes y dificultad se agregan en el Hito 7 -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/leveling.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
